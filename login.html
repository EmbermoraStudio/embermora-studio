<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Embermora Studio</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <main class="login-container">

        <div class="login-card">

            <img
                src="logo.png"
                alt="Embermora Studio"
                class="login-logo"
            >

            <p class="login-label">
                EMBERMORA STUDIO
            </p>

            <h1>
                Painel Administrativo
            </h1>

            <p class="login-description">
                Entre para gerenciar o Studio.
            </p>


            <form id="login-form">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Seu e-mail"
                    autocomplete="email"
                    required
                >


                <label for="password">
                    Senha
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Sua senha"
                    autocomplete="current-password"
                    required
                >


                <button
                    type="submit"
                    class="login-button"
                >
                    Entrar
                </button>

            </form>


            <p
                id="login-message"
                class="login-message"
            ></p>


            <a
                href="index.html"
                class="login-back"
            >
                ← Voltar ao site
            </a>

        </div>

    </main>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        const SUPABASE_URL =
            "https://snbjzkdjvpdqkgnqmnol.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_slbKbii7pGS3rjKzldbDPQ_AvaQdzd9";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        const form =
            document.getElementById("login-form");

        const message =
            document.getElementById("login-message");


        form.addEventListener("submit", async (event) => {

            event.preventDefault();

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;


            message.textContent = "Entrando...";
            message.className = "login-message";


            const { data, error } =
                await supabaseClient.auth.signInWithPassword({
                    email,
                    password
                });


            if (error) {

                message.textContent =
                    "E-mail ou senha incorretos.";

                message.className =
                    "login-message error";

                return;
            }


            if (data.session) {

                message.textContent =
                    "Login realizado!";

                message.className =
                    "login-message success";


                window.location.href =
                    "admin.html";
            }

        });

    </script>

</body>

</html>
